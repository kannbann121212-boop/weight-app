<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体重管理</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8fbf7f">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<main class="app">
  <img class="appIcon" src="icon-192.png" alt="">
  <h1>体重管理</h1>

  <section class="card">
    <label>今日の体重</label>
    <input id="weight" type="number" step="0.1" placeholder="例：55.2">
    <button id="saveWeightBtn">体重を保存</button>
    <p id="weightMessage"></p>
  </section>

  <section class="card">
    <label>目標体重</label>
    <input id="goal" type="number" step="0.1" placeholder="例：50.0">
    <button id="saveGoalBtn">目標を保存</button>
    <p id="goalMessage"></p>
  </section>

  <section class="goalBox">
    <p class="goalLabel">目標まで</p>
    <p id="remainingText" class="remaining">-- kg</p>
  </section>

  <section class="card">
    <h2>グラフ</h2>
    <div class="chartWrap">
      <canvas id="weightChart"></canvas>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
